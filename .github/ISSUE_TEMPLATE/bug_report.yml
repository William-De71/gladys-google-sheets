name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your Client secret, a token or the content of private spreadsheets: the logs of the integration hide them, but check before posting.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Google Sheets, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: google-setup
    attributes:
      label: Google Cloud setup
      description: Publishing status of the consent screen (Testing or In production), redirect URI declared, and how you reach Gladys (local address, HTTPS, Gladys Plus).
      placeholder: 'In production, https://my.gladysassistant.com/redirect/oauth, local http://192.168.1.50'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision): click **Diagnostic** in the integration configuration first, it writes an anonymized summary (connection, time zone, API calls, lists). In developer mode only, `DEBUG=gladys-integration-sdk` adds the SDK debug logs.
      render: text
