<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
  <!-- Illustration: architecture of the Google Sheets integration for Gladys. -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="960" height="320" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="80" width="220" height="150" rx="14" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
    <text x="130" y="120" font-size="20" font-weight="bold" fill="#1f2328">Gladys Assistant</text>
    <text x="130" y="150" font-size="14" fill="#57606a">watch devices, scenes,</text>
    <text x="130" y="170" font-size="14" fill="#57606a">dashboard widgets</text>
    <text x="130" y="190" font-size="14" fill="#57606a">"Connect" button</text>
    <rect x="360" y="80" width="230" height="150" rx="14" fill="#eef8f0" stroke="#1a7f37" stroke-width="2"/>
    <text x="475" y="120" font-size="17" font-weight="bold" fill="#1f2328">gladys-google-sheets</text>
    <text x="475" y="150" font-size="14" fill="#57606a">Docker container</text>
    <text x="475" y="170" font-size="14" fill="#57606a">tokens, watched cells and rows</text>
    <text x="475" y="190" font-size="14" fill="#57606a">reads every 2 min (timer)</text>
    <rect x="710" y="30" width="230" height="110" rx="14" fill="#e6f0fc" stroke="#1c4f96" stroke-width="2"/>
    <text x="825" y="66" font-size="17" font-weight="bold" fill="#1f2328">Google OAuth 2.0</text>
    <text x="825" y="92" font-size="13" fill="#57606a">your own Cloud client</text>
    <text x="825" y="112" font-size="13" fill="#57606a">scope: spreadsheets, PKCE</text>
    <rect x="710" y="170" width="230" height="110" rx="14" fill="#e6f0fc" stroke="#1c4f96" stroke-width="2"/>
    <text x="825" y="206" font-size="17" font-weight="bold" fill="#1f2328">Google Sheets API v4</text>
    <text x="825" y="232" font-size="13" fill="#57606a">no push: polling</text>
    <text x="825" y="252" font-size="13" fill="#57606a">60 requests / min / user</text>
    <g stroke="#57606a" stroke-width="2.5" fill="none" marker-end="url(#a)" marker-start="url(#a)">
      <path d="M244 155 H356"/>
      <path d="M594 130 L706 90"/>
      <path d="M594 180 L706 220"/>
    </g>
    <text x="300" y="140" font-size="12" fill="#57606a">REST /api/integration/v1</text>
    <text x="300" y="178" font-size="12" fill="#57606a">+ WebSocket</text>
    <text x="480" y="300" font-size="13" fill="#8c959f" font-style="italic">Illustration — cloud only: your cells travel between Google and your Gladys</text>
  </g>
</svg>
